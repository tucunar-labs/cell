name: Community source distribution
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/tucunar-cell/**'
      - 'tools/tucunar-cell-console/**'
      - 'contracts/**'
      - '.github/workflows/community-export.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  standalone-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tucunar-cell/go.mod
          cache-dependency-path: |
            tools/tucunar-cell/go.sum
            contracts/go.sum
      - name: Export and verify outside the monorepo
        run: python3 tools/tucunar-cell/scripts/verify-export.py
  native-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned Raven library
        run: python3 tools/tucunar-cell/scripts/community-tools.py "$RUNNER_TEMP/raven" --raven
      - name: Test and build native console
        working-directory: tools/tucunar-cell-console
        env:
          RAVEN_LIB_DIR: ${{ runner.temp }}/raven
        run: |
          cargo test --locked
          cargo build --release --locked
  reference-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify reference reader routing
        working-directory: tools/tucunar-cell/examples/scada
        run: |
          python -m pip install -r requirements.txt
          python -m unittest test_readers.py
  source-candidate:
    needs: [standalone-source, native-console, reference-readers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package reviewable source candidate
        run: python3 tools/tucunar-cell/scripts/export-core.py "$RUNNER_TEMP/tucunar-cell-community"
      - uses: actions/upload-artifact@v4
        with:
          name: tucunar-cell-community-source
          path: |
            ${{ runner.temp }}/tucunar-cell-community.tar.gz
            ${{ runner.temp }}/tucunar-cell-community.tar.gz.sha256
          if-no-files-found: error
