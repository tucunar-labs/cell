name: Community release candidate
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package (defaults to tools/tucunar-cell/VERSION)
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  source-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/tucunar-cell/go.mod
          cache-dependency-path: |
            tools/tucunar-cell/go.sum
            contracts/go.sum
      - name: Verify allowlist export, Go modules and Community tooling tests
        run: python3 tools/tucunar-cell/scripts/verify-export.py

  native-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned Raven library
        run: python3 tools/tucunar-cell/scripts/community-tools.py "$RUNNER_TEMP/raven" --raven
      - name: Test and build native console
        working-directory: tools/tucunar-cell-console
        env:
          RAVEN_LIB_DIR: ${{ runner.temp }}/raven
        run: |
          cargo test --locked
          cargo build --release --locked

  reference-readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify reference reader routing
        working-directory: tools/tucunar-cell/examples/scada
        run: |
          python -m pip install -r requirements.txt
          python -m unittest test_readers.py

  service-images:
    needs: [source-gates, native-console, reference-readers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [swift, condor, canary-evaluator, hummingbird]
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: meta
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" && "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(tr -d '[:space:]' < tools/tucunar-cell/VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build single-service OCI image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/tucunar-cell/Containerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/image-${{ matrix.service }}.oci.tar
          tags: ghcr.io/tucunar/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.meta.outputs.version }}
      - name: Compute OCI archive checksum
        run: |
          cd "$RUNNER_TEMP"
          sha256sum "image-${{ matrix.service }}.oci.tar" > "image-${{ matrix.service }}.oci.tar.sha256"
      - name: Attest image archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/image-${{ matrix.service }}.oci.tar
      - uses: actions/upload-artifact@v4
        with:
          name: oci-${{ matrix.service }}-linux-amd64
          path: |
            ${{ runner.temp }}/image-${{ matrix.service }}.oci.tar
            ${{ runner.temp }}/image-${{ matrix.service }}.oci.tar.sha256
          if-no-files-found: error

  package-candidate:
    needs: [service-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: meta
        run: |
          version="${{ inputs.version }}"
          if [[ -z "$version" && "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$version" ]]; then
            version="$(tr -d '[:space:]' < tools/tucunar-cell/VERSION)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package allowlisted source archive
        run: |
          python3 tools/tucunar-cell/scripts/export-core.py \
            "$RUNNER_TEMP/tucunar-cell-${{ steps.meta.outputs.version }}"
      - name: Generate SPDX SBOM for source distribution
        uses: anchore/sbom-action@v0
        with:
          path: ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.spdx.json
      - name: Sign release checksums (when RELEASE_SIGNING_KEY is configured)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_ALLOWED_SIGNERS: ${{ secrets.RELEASE_ALLOWED_SIGNERS }}
        run: |
          if [[ -n "$RELEASE_SIGNING_KEY" ]]; then
            install -m 0600 /dev/null "$RUNNER_TEMP/release_key"
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release_key"
            python3 tools/tucunar-cell/scripts/community-bundle.py sign \
              --signing-key "$RUNNER_TEMP/release_key" \
              "$RUNNER_TEMP/tucunar-cell-${{ steps.meta.outputs.version }}.tar.gz.sha256" \
              "$RUNNER_TEMP/tucunar-cell-${{ steps.meta.outputs.version }}.spdx.json"
            rm -f "$RUNNER_TEMP/release_key"
            if [[ -n "$RELEASE_ALLOWED_SIGNERS" ]]; then
              printf '%s\n' "$RELEASE_ALLOWED_SIGNERS" > "$RUNNER_TEMP/allowed_signers"
            fi
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "ERROR: RELEASE_SIGNING_KEY secret is required to sign tagged releases" >&2
            exit 1
          else
            echo "Note: RELEASE_SIGNING_KEY not set; workflow_dispatch produces unsigned candidate artifacts."
          fi
      - name: Attest source archive and SBOM provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.tar.gz
            ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: tucunar-cell-release-candidate-${{ steps.meta.outputs.version }}
          path: |
            ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.tar.gz
            ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.tar.gz.sha256
            ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.tar.gz.sha256.sig
            ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.spdx.json
            ${{ runner.temp }}/tucunar-cell-${{ steps.meta.outputs.version }}.spdx.json.sig
            ${{ runner.temp }}/allowed_signers
          if-no-files-found: ignore
