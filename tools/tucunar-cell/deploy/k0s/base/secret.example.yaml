# Copy this file to a secret manager or create the Secret out-of-band.
# It is intentionally not part of the base Kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: tucunar-cell-secrets
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: replace-with-a-real-password
  SIGNAL_INGEST_TOKEN: replace-with-at-least-32-random-bytes
  CANARY_NODE_API_TOKEN: replace-with-at-least-32-random-bytes
  TUCUNAR_INTERNAL_TOKEN: replace-with-at-least-32-random-bytes

# Optional provider/channel Secrets are separate references and are not part
# of this common Secret. Create them out-of-band only when the capability is
# enabled:
#
# kubectl -n tucunar-cell create secret generic tucunar-source-secrets \
#   --from-literal=MERCADOPAGO_ACCESS_TOKEN=... \
#   --from-literal=SHOPIFY_SECRET=...
# kubectl -n tucunar-cell create secret generic tucunar-channel-secrets \
#   --from-literal=PIGEON_SLACK_WEBHOOK_URL=https://...
# kubectl -n tucunar-cell create secret generic tucunar-ai-secrets \
#   --from-literal=AI_REASONING_ENABLED=1 \
#   --from-literal=DEEPSEEK_API_KEY=...
