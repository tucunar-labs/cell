# Each capability is a separate Deployment and Service even while its first
# implementation is a contract stub. This is the seam for customer-owned
# replacements and independent release/scale decisions.
apiVersion: v1
kind: Service
metadata:
  name: kingfisher
spec:
  selector: {app.kubernetes.io/name: kingfisher}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kingfisher
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: kingfisher}}
  template:
    metadata: {labels: {app.kubernetes.io/name: kingfisher, app.kubernetes.io/part-of: tucunar-cell}}
    spec:
      containers:
        - name: kingfisher
          image: ghcr.io/tucunar/kingfisher:dev
          ports: [{name: http, containerPort: 8080}]
          env: [{name: PORT, value: "8080"}]
          envFrom: [{configMapRef: {name: tucunar-cell-config}}, {secretRef: {name: tucunar-cell-secrets}}]
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
---
