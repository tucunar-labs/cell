apiVersion: v1
kind: Service
metadata:
  name: shiitake
spec:
  selector: {app.kubernetes.io/name: shiitake}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shiitake
spec:
  # Hard DeepSeek reservations use a process mutex plus the durable ClickHouse
  # ledger. Do not scale this deployment horizontally without replacing that
  # reservation primitive with a distributed one.
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: shiitake}}
  template:
    metadata: {labels: {app.kubernetes.io/name: shiitake, app.kubernetes.io/part-of: tucunar-cell}}
    spec:
      containers:
        - name: shiitake
          image: ghcr.io/tucunar/shiitake:dev
          ports: [{name: http, containerPort: 8080}]
          env: [{name: PORT, value: "8080"}]
          envFrom:
            - configMapRef: {name: tucunar-cell-config}
            - secretRef: {name: tucunar-cell-secrets}
            - secretRef: {name: tucunar-cell-ai-secrets, optional: true}
            - secretRef: {name: tucunar-ai-secrets, optional: true}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
