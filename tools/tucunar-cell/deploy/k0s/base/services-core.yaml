apiVersion: v1
kind: Service
metadata:
  name: swift
spec:
  selector:
    app.kubernetes.io/name: swift
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swift
  labels:
    app.kubernetes.io/name: swift
    app.kubernetes.io/part-of: tucunar-cell
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swift
  template:
    metadata:
      labels:
        app.kubernetes.io/name: swift
        app.kubernetes.io/part-of: tucunar-cell
    spec:
      containers:
        - name: swift
          image: ghcr.io/tucunar/swift:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          envFrom:
            - configMapRef:
                name: tucunar-cell-config
            - secretRef:
                name: tucunar-cell-secrets
            - secretRef:
                name: tucunar-source-secrets
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
---
