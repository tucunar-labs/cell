     id="style1"><![CDATA[
    .canvas { fill: #f1f4f5; }
    .panel { fill: #e7edf0; stroke: #d9e2e7; stroke-width: 1; }
    .panel.dark { fill: #0b1424; stroke: #2c405c; }
    .title { fill: #102033; font-family: Geist, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .02em; }
    .dark-title, .dark-role, .dark-description { fill: #f1f4f5; }
    .role { fill: #62758a; font-family: monospace; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; }
    .description { fill: #62758a; font-family: Geist, Arial, sans-serif; font-size: 12px; font-weight: 400; }
    .glyph .mask { fill: none; stroke: #e7edf0; stroke-width: 21; stroke-linecap: round; stroke-linejoin: round; }
    .glyph.dark .mask { stroke: #0b1424; }
    .glyph .shape { fill: none; stroke: #102033; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .glyph.dark .shape { stroke: #f1f4f5; }
    .glyph .accent { stroke: #5c82b1; }
    .glyph .warm { stroke: #d08351; }
    .glyph .triangle { fill: #e7edf0; stroke: #d08351; stroke-width: 9; stroke-linejoin: round; }
    .glyph.dark .triangle { fill: #0b1424; }
    .glyph .circle-cut { fill: #e7edf0; stroke: #d08351; stroke-width: 9; stroke-linejoin: round; }
    .glyph .cutout { fill: #e7edf0; stroke: none; }
    .glyph .bubble { fill: #e7edf0; stroke: #7d77b5; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .glyph .solid { fill: #102033; stroke: none; }
    .glyph .solid.accent { fill: #5c82b1; }
    .sheet-label { fill: #62758a; font-family: monospace; font-size: 9px; letter-spacing: .14em; }
  ]]></style>
